[tool.poetry]
package-mode = false

[project]
name = "Animal"
version = "0.1.0"
description = "Animal"
requires-python = ">=3.12,<3.15"
authors = [
    { name = "KateySt", email = "kateystetsenko@gmail.com" }
]
dependencies = [
    "asyncpg>=0.31.0,<0.32.0",
    "fastapi>=0.139.2,<0.140.0",
    "uvicorn>=0.51.0,<0.52.0",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "alembic>=1.18.5,<2",
    "structlog>=26.1.0,<27",
    "colorama>=0.4.6,<0.5.0",
    "fastcrud>=0.22.3,<0.23.0",
    "starlette-admin>=0.17.1,<0.18.0",
    "itsdangerous>=2.2.0,<3",
    "python-jose>=3.5.0,<4",
    "redis>=8.0.1,<9",
    "fastapi-cache2>=0.2.2,<0.3.0",
    "httpx-oauth>=0.15,<0.16",
    "authlib>=1.3,<2",
    "bcrypt>=4.2,<5",
    "pyjwt>=2.13.0,<3",
    "stripe>=15.3.1,<16",
    "email-validator>=2.3.0,<3",
    "anthropic>=0.120.2,<0.121.0",
    "httpx2>=2.12.0,<3",
    "minio>=7.2.20,<8",
    "pillow>=12.3.0,<13",
    "livekit-api>=1.2.1,<2",
    "tenacity>=9.1.4,<10",
]

# Vercel builds with uv: install deps only, never build the project as a package.
[tool.uv]
package = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = "^alembic/"

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "alembic.versions.*",
    "alembic.env",
]
ignore_errors = true

[tool.poetry.group.dev.dependencies]
ruff = "^0.15"
mypy = "^2.3"
pytest = "^8.3"
pytest-asyncio = "^0.24"
httpx = "^0.28"
factory-boy = "^3.3"
faker = "^33.0"
anyio = {extras = ["trio"], version = "^4.6"}
asgi-lifespan = "^2.1"
python-dotenv = "^1.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: pure logic, no I/O",
    "integration: FastAPI + real DB",
]
