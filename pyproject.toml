[tool.poetry]
package-mode = false
name = "animal"

[project]
name = "Animal"
version = "0.1.0"
description = "Animal"
requires-python = ">=3.11"
authors = [
    { name = "KateySt", email = "kateystetsenko@gmail.com" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = "^alembic/"

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "alembic.versions.*",
    "alembic.env",
]
ignore_errors = true

[tool.poetry.dependencies]
asyncpg = "^0.31.0"
fastapi = "^0.139.2"
uvicorn = "^0.51.0"
pydantic = "^2.13.4"
pydantic-settings = "^2.14.2"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.51"}
alembic = "^1.18.5"
python = "^3.11"
structlog = "^26.1.0"
colorama = "^0.4.6"
fastcrud = "^0.22.3"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15"
mypy = "^2.3"
