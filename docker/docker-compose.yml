services:
  postgres:
    image: postgres:16-alpine
    container_name: animal_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${DB_NAME:-db}
      POSTGRES_USER: ${DB_USER:-animal_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - animal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-animal_admin} -d ${DB_NAME:-db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: animal_pgadmin
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - animal_net
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: animal_redis
    restart: unless-stopped
    env_file:
      - ../.env
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-admin}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - yes
      - --appendfsync
      - everysec
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-admin}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - animal_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redisinsight:
    image: redis/redisinsight:latest
    container_name: animal_redisinsight
    restart: unless-stopped
    volumes:
      - redisinsight_data:/data
    ports:
      - "5540:5540"
    networks:
      - animal_net
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  redisinsight_data:

networks:
  animal_net:
    driver: bridge
