[tool.poetry]
package-mode = false
name = "animal"

[project]
name = "Animal"
version = "0.1.0"
description = "Animal"
requires-python = ">=3.11"
authors = [
    { name = "KateySt", email = "kateystetsenko@gmail.com" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = "^alembic/"

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "alembic.versions.*",
    "alembic.env",
]
ignore_errors = true

[tool.poetry.dependencies]
asyncpg = "^0.31.0"
fastapi = "^0.139.2"
uvicorn = "^0.51.0"
pydantic = "^2.13.4"
pydantic-settings = "^2.14.2"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.51"}
alembic = "^1.18.5"
python = "^3.11"
structlog = "^26.1.0"
colorama = "^0.4.6"
fastcrud = "^0.22.3"
starlette-admin = {extras = ["full"], version = "^0.17.1"}
itsdangerous = "^2.2.0"
python-jose = "^3.5.0"
redis = {extras = ["asyncio"], version = "^8.0.1"}
fastapi-cache2 = "^0.2.2"
httpx-oauth = "^0.15"
authlib = "^1.3"
bcrypt = "^4.2"
pyjwt = "^2.13.0"
stripe = "^15.3.1"
email-validator = "^2.3.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15"
mypy = "^2.3"
pytest = "^8.3"
pytest-asyncio = "^0.24"
httpx = "^0.27"
factory-boy = "^3.3"
faker = "^33.0"
anyio = {extras = ["trio"], version = "^4.6"}
asgi-lifespan = "^2.1"
python-dotenv = "^1.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: pure logic, no I/O",
    "integration: FastAPI + real DB",
]
